<main id="main-content">
  <div class="container">
    <section class="hero">
      <h1>Mitglied werden</h1>
      <p>Werde Teil der SV Ente Familie und profitiere von zahlreichen Vorteilen!</p>
    </section>

    <app-membership-benefits />
    <app-membership-types />

    <app-fee-calculator
      [membershipPlans]="membershipPlans"
      [sports]="sports"
      [selectedPlanId]="selectedPlanId()"
      [selectedSportId]="selectedSportId()"
      [selectedPlanName]="selectedPlan().name"
      [selectedSportName]="selectedSport()?.name ?? null"
      [monthlyPriceLabel]="formatPrice(monthlyPrice())"
      [yearlyPriceLabel]="formatPrice(yearlyPrice())"
      (planChanged)="onPlanChanged($event)"
      (sportChanged)="onSportChanged($event)"
    />

    <app-membership-registration-form />
    <app-membership-faq />
    <app-membership-cta />
  </div>
</main>
