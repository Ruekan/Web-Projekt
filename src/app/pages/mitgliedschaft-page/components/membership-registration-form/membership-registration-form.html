<section class="membership-form" id="anmeldeformular">
  <h2>Anmeldeformular</h2>
  <p class="form-intro">Fülle das Formular aus und werde Teil der SV Ente Familie!</p>

  <form class="registration-form">
    <div class="form-section">
      <h3>Persönliche Daten</h3>
      <div class="form-row">
        <div class="form-group">
          <label for="vorname">Vorname *</label>
          <input type="text" id="vorname" name="vorname" required>
        </div>
        <div class="form-group">
          <label for="nachname">Nachname *</label>
          <input type="text" id="nachname" name="nachname" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="geburtsdatum">Geburtsdatum *</label>
          <input type="date" id="geburtsdatum" name="geburtsdatum" required>
        </div>
        <div class="form-group">
          <label for="geschlecht">Geschlecht</label>
          <select id="geschlecht" name="geschlecht">
            <option value="">Bitte wählen</option>
            <option value="männlich">Männlich</option>
            <option value="weiblich">Weiblich</option>
            <option value="divers">Divers</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3>Kontaktdaten</h3>
      <div class="form-group">
        <label for="strasse">Straße & Hausnummer *</label>
        <input type="text" id="strasse" name="strasse" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="plz">PLZ *</label>
          <input type="text" id="plz" name="plz" required>
        </div>
        <div class="form-group">
          <label for="ort">Ort *</label>
          <input type="text" id="ort" name="ort" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="email">E-Mail *</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="telefon">Telefon</label>
          <input type="tel" id="telefon" name="telefon">
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3>Mitgliedschaft</h3>
      <div class="form-group">
        <label for="mitgliedschaftstyp">Mitgliedschaftstyp *</label>
        <select id="mitgliedschaftstyp" name="mitgliedschaftstyp" required>
          <option value="">Bitte wählen</option>
          <option value="kinder">Kinder & Jugend (12€/Monat)</option>
          <option value="erwachsene">Erwachsene (24€/Monat)</option>
          <option value="familie">Familie (55€/Monat)</option>
          <option value="passiv">Fördermitglied (5€/Monat)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="sportarten">Interessierte Sportarten (Mehrfachauswahl möglich)</label>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" name="sportarten" value="fussball">
            Fußball
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="sportarten" value="handball">
            Handball
          </label>
          <label class="checkbox-label">
            <input type="checkbox" name="sportarten" value="basketball">
            Basketball
          </label>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3>Zusätzliche Informationen</h3>
      <div class="form-group">
        <label for="nachricht">Nachricht / Besondere Wünsche</label>
        <textarea id="nachricht" name="nachricht" rows="4"></textarea>
      </div>
    </div>

    <div class="form-section">
      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" name="datenschutz" required>
          Ich habe die <a href="#" class="link-inline">Datenschutzerklärung</a> gelesen und stimme zu *
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="agb" required>
          Ich akzeptiere die <a href="#" class="link-inline">Vereinssatzung</a> *
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="newsletter">
          Ich möchte den Newsletter erhalten
        </label>
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-submit">Anmeldung absenden</button>
      <button type="reset" class="btn-reset">Zurücksetzen</button>
    </div>

    <p class="form-note">* Pflichtfelder</p>
  </form>
</section>
